<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>CKC Attendance Admin</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
    }

    .header {
      background: linear-gradient(
        135deg,
        #1e3a8a,
        #2563eb
      );
      color: white;
      padding: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 14px;
    }

    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 16px;
    }

    .summary {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    .summary-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      border: 1px solid #e2e8f0;
      box-shadow:
        0 3px 12px rgba(15,23,42,.06);
    }

    .summary-number {
      font-size: 32px;
      font-weight: bold;
    }

    .summary-label {
      margin-top: 5px;
      font-size: 12px;
      color: #64748b;
      font-weight: bold;
    }

    .scanner-section {
      background: white;
      border-radius: 14px;
      padding: 20px;
      border: 1px solid #e2e8f0;
      margin-bottom: 18px;
    }

    .scanner-section h2 {
      margin-top: 0;
      color: #1e3a8a;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    #attendanceResult {
      margin-top: 15px;
      padding: 14px;
      min-height: 50px;
      text-align: center;
      font-weight: bold;
      border-radius: 10px;
      background: #f8fafc;
    }

    .participant-section {
      background: white;
      border-radius: 14px;
      padding: 20px;
      border: 1px solid #e2e8f0;
    }

    .participant-section h2 {
      margin-top: 0;
      color: #1e3a8a;
    }

    #participantDisplay {
      min-height: 100px;
      padding: 15px;
      background: #f8fafc;
      border-radius: 10px;
    }

    .attendance-card {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      max-width: 760px;
      margin: 0 auto;
      padding: 18px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(15,23,42,.08);
    }

    .attendance-photo {
      width: 120px;
      height: 150px;
      flex: 0 0 120px;
      object-fit: cover;
      border-radius: 10px;
      background: #e2e8f0;
      border: 1px solid #cbd5e1;
    }

    .attendance-info {
      flex: 1;
      min-width: 0;
    }

    .attendance-status {
      display: inline-block;
      margin-bottom: 12px;
      padding: 7px 12px;
      border-radius: 999px;
      background: #dcfce7;
      color: #166534;
      font-size: 12px;
      font-weight: bold;
    }

    .attendance-name {
      margin-bottom: 3px;
      font-size: 22px;
      font-weight: bold;
      color: #0f172a;
    }

    .attendance-alias {
      margin-bottom: 14px;
      color: #64748b;
      font-size: 14px;
    }

    .attendance-row {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 6px;
      margin-bottom: 7px;
      font-size: 14px;
    }

    .attendance-label {
      color: #64748b;
      font-weight: bold;
    }

    .attendance-value {
      color: #0f172a;
      word-break: break-word;
    }

    @media (max-width: 700px) {

      .attendance-card {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .attendance-info {
        width: 100%;
      }

      .attendance-row {
        grid-template-columns: 1fr;
        gap: 2px;
        margin-bottom: 10px;
      }

    }

    @media (max-width: 700px) {

      .summary {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }

  </style>

</head>

<body>

  <header class="header">

    <h1>CKC FRIENDSHIP CUP 2026</h1>

    <p>ATTENDANCE CONTROL</p>

  </header>

  <main class="container">

    <section class="summary">

      <div class="summary-card">
        <div
          id="totalRegistered"
          class="summary-number">
          -
        </div>
        <div class="summary-label">
          TOTAL PESERTA
        </div>
      </div>

      <div class="summary-card">
        <div
          id="totalAttended"
          class="summary-number">
          -
        </div>
        <div class="summary-label">
          SUDAH ABSEN
        </div>
      </div>

      <div class="summary-card">
        <div
          id="totalRemaining"
          class="summary-number">
          -
        </div>
        <div class="summary-label">
          BELUM ABSEN
        </div>
      </div>


    </section>

    <section class="scanner-section">

      <h2>SCAN ABSENSI</h2>

      <div id="reader"></div>

      <div id="attendanceResult">
        Arahkan kamera ke QR Badge peserta.
      </div>

    </section>

    <section class="participant-section">

      <h2>DATA PESERTA TERAKHIR</h2>

      <div id="participantDisplay">
        Belum ada hasil scan.
      </div>

    </section>

  </main>

  <script>

    let attendanceScanner = null;
    let attendanceScanLocked = false;

    function showResult(message) {

      const el =
        document.getElementById(
          "attendanceResult"
        );

      if (el) {
        el.textContent = message;
      }

    }

    function showParticipant(message) {

      const el =
        document.getElementById(
          "participantDisplay"
        );

      if (el) {
        el.innerHTML = message;
      }

    }

    async function startAttendanceScanner() {

      attendanceScanner =
        new Html5Qrcode("reader");

      try {

        await attendanceScanner.start(
          {
            facingMode: "environment"
          },
          {
            fps: 10,
            qrbox: {
              width: 250,
              height: 250
            }
          },
          function(decodedText) {

            if (attendanceScanLocked) {
              return;
            }

            attendanceScanLocked = true;

            const qrValue =
              String(decodedText).trim();

            const apiUrl =
              "https://script.google.com/macros/s/AKfycbwq7trLWjvUDd_ld0i_rNmZyt0fvlFbiP4wT-Pw0TC5RjLXCCkUwrGnc8hJCoPO6rMG/exec";

            const callbackName =
              "attendanceCallback_" +
              Date.now();

            window[callbackName] =
              function (result) {

                if (result) {

                  const totalRegisteredEl =
                    document.getElementById("totalRegistered");

                  const totalAttendedEl =
                    document.getElementById("totalAttended");

                  const totalRemainingEl =
                    document.getElementById("totalRemaining");

                  if (totalRegisteredEl) {
                    totalRegisteredEl.textContent =
                      result.totalRegistered ?? 0;
                  }

                  if (totalAttendedEl) {
                    totalAttendedEl.textContent =
                      result.totalAttended ?? 0;
                  }

                  if (totalRemainingEl) {
                    totalRemainingEl.textContent =
                      result.totalRemaining ?? 0;
                  }

                }

                console.log(
                  "HASIL ABSENSI:",
                  result
                );

                const attendanceResult =
                  document.getElementById(
                    "attendanceResult"
                  );

                if (!attendanceResult) {
                  attendanceScanLocked = false;
                  return;
                }

                if (
                  result &&
                  result.success
                ) {

                  const nama =
                    result.nama || "-";

                  const alias =
                    result.alias || "-";

                  const kategori =
                    result.kategori || "-";

                  const club =
                    result.club || "-";

                  const noReg =
                    result.noReg || "-";

                  const timestamp =
                    result.timestamp || "-";

                  const foto =
                    result.foto || "";

                  const statusText =
                    result.status ===
                    "ALREADY_ATTENDED"
                      ? "PESERTA SUDAH ABSENSI"
                      : "ABSENSI BERHASIL";

                  attendanceResult.innerHTML =
                    "<strong>" +
                    statusText +
                    "</strong>";

                  showParticipant(
                    '<div class="attendance-card">' +
                      (
                        foto
                          ? '<img class="attendance-photo" src="' +
                            foto +
                            '" alt="Foto Peserta">'
                          : '<div class="attendance-photo"></div>'
                      ) +
                      '<div class="attendance-info">' +
                        '<div class="attendance-status">' +
                          statusText +
                        '</div>' +
                        '<div class="attendance-name">' +
                          nama +
                        '</div>' +
                        '<div class="attendance-alias">' +
                          alias +
                        '</div>' +
                        '<div class="attendance-row">' +
                          '<div class="attendance-label">No. Registrasi</div>' +
                          '<div class="attendance-value">' +
                            noReg +
                          '</div>' +
                        '</div>' +
                        '<div class="attendance-row">' +
                          '<div class="attendance-label">Kategori</div>' +
                          '<div class="attendance-value">' +
                            kategori +
                          '</div>' +
                        '</div>' +
                        '<div class="attendance-row">' +
                          '<div class="attendance-label">Club</div>' +
                          '<div class="attendance-value">' +
                            club +
                          '</div>' +
                        '</div>' +
                        '<div class="attendance-row">' +
                          '<div class="attendance-label">Waktu Absensi</div>' +
                          '<div class="attendance-value">' +
                            timestamp +
                          '</div>' +
                        '</div>' +
                      '</div>' +
                    '</div>'
                  );

                } else {

                  attendanceResult.textContent =
                    result &&
                    result.message
                      ? result.message
                      : "Absensi gagal.";

                  showParticipant(
                    "Data peserta tidak tersedia."
                  );

                }

                attendanceScanLocked = false;

                delete window[callbackName];

                const script =
                  document.getElementById(
                    callbackName
                  );

                if (script) {
                  script.remove();
                }

              };

            const script =
              document.createElement("script");

            script.id = callbackName;

            script.src =
              apiUrl +
              "?api=attendance" +
              "&noReg=" +
              encodeURIComponent(qrValue) +
              "&scanner=" +
              encodeURIComponent("Attendance Admin") +
              "&prefix=" +
              encodeURIComponent(callbackName);

            document.body.appendChild(script);


            showParticipant(
              "<strong>QR:</strong> " +
              qrValue
            );

          },
          function() {
            // QR belum terbaca
          }
        );

      } catch (error) {

        console.error(
          "KAMERA ABSENSI GAGAL:",
          error
        );

        showResult(
          "Kamera tidak dapat digunakan. " +
          "Pastikan izin kamera diberikan."
        );

      }

    }

    startAttendanceScanner();

  </script>

</body>

</html>
